[project]
name = "hackfire-backend"
version = "0.1.0"
description = "HackFire backend: agent tools, triage state and dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
