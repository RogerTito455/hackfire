# A tool SLNG hosts: an API Request tool named get_evacuation_route, created in
# the SLNG dashboard and pointing at POST <backend>/tools/get_evacuation_route.
slng: get_evacuation_route

description: >-
  Get the exit route from the resident's home that avoids the predicted fire,
  as spoken directions. Set mode to "car" if they will leave by car and to
  "walking" if they will leave on foot; ask them first if you do not know. The
  address is filled in for you. Call it only when the order is to leave, not
  when the order is to stay inside.

# The model supplies only `mode`; the address comes from the call's variables.
inject:
  - address: "{{address}}"

# Routing can take a moment. Spoken word for word while the request runs.
announce: Un momento, que miro su ruta.

effect: returns_data
