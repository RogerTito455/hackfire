# A tool SLNG hosts: an API Request tool named get_fire_status, created in the
# SLNG dashboard and pointing at POST <backend>/tools/get_fire_status. Unmute
# creates nothing; deploy resolves the name against the organisation.
slng: get_fire_status

# Overrides the dashboard description for this agent, so the repo holds it.
description: >-
  Get the current state of the predicted fire for the resident's zone: whether
  the zone is at risk, the estimated minutes until the fire reaches it, and a
  short summary. Call it once, right after you have said who you are and why
  you are calling, and before you give any instruction. The zone is filled in
  for you.

# The model never sees or chooses the zone; it comes from the call's variables.
inject:
  - zone: "{{zone}}"

effect: returns_data
