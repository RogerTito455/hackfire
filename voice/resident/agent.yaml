# HackFire resident agent (slice 6, issue #7).
#
# One outbound call to one registered resident of a zone the predicted fire is
# heading for: say who is calling, give the fire status and the exit route, ask
# three questions, and record the answer with report_status so the resident's
# pin changes on the coordinator's dashboard.
#
# Prerequisites, placeholders and open questions: ../README.md.
version: 1

# Deploys as `hackfire-resident-slng`: the package name joined to the target
# name. An SLNG name is unique per organisation and a push replaces the agent
# it matches, so rename it here only on purpose.
name: hackfire-resident
entry_agent: evacuation_assistant

agents:
  evacuation_assistant:
    # Spanish on purpose: the agent only speaks Castilian Spanish, and a prompt
    # in the language of the call keeps the model from drifting into English.
    instructions: instructions.md
    think: reasoning
    speak: nestor
    tools:
      - get_evacuation_route
      - report_status
      - end_call

# No `secrets:` block: on the slng target the package reads no environment
# variable. `unmute deploy` takes SLNG_API_KEY from the shell. See .env.example.

models:
  think:
    reasoning:
      description: NVIDIA Nemotron Super 3 (120B) on Bedrock, served by SLNG without a key of our own
      # SLNG serves the LLM; the team dropped Nebius on 2026-09-19. For Spanish in an EU region, SLNG's
      # agents accept only the two Nemotron models, and only with the `:latest` suffix; Groq's
      # gpt-oss-120b is refused for `es` in eu-north and eu-west. Super over Nano 3 (30B): the
      # triage must be right before it is fast. Nano is the switch if a turn feels slow (#14).
      # No `provider:` on purpose: the slng driver sends `model` exactly as written.
      model: "bedrock-mantle/nvidia.nemotron-super-3-120b:latest"
      # Low, so the same answer gets the same triage.
      temperature: 0.2
  speak:
    nestor:
      # Fish S2.1 Pro (Castilian voice Elena, 566359628f6a4d5fabf902f6f64ecec1) failed on
      # every session with a tts_error: SLNG hosts it only in nebius-eu-north1 and
      # ap-southeast-2, and the agent runs in eu-north. Aura 2 is deployed in eu, where
      # Soniox, which the agent reaches fine, lives too.
      description: Deepgram Aura 2 through SLNG, Spanish voice Nestor (calm, professional, clear)
      provider: slng
      model: "deepgram/aura:2"
      voice: "aura-2-nestor-es"
      # Aura's speech rate, 0.7 to 1.5. Test calls felt slow at 1.0 and still at 1.15.
      speed: 1.3
  listen:
    transcriber:
      description: Soniox real-time v5 through SLNG, Spanish
      provider: slng
      model: "soniox/speech-ai:rt-v5"
      language: es

# Call-start values. The call campaign (#8) sends all four as `arguments` when
# it dispatches a call.
#
# TEST DEFAULTS(voice): the defaults are sample resident n01 from
# data/neighbors.sample.json, only because the dashboard's Test agent panel
# cannot pass arguments and SLNG refuses a session missing a required
# variable. A real dispatch must always send all four, or the call reports on
# n01. Remove the defaults once calls come from the campaign.
variables:
  neighbor_id:
    type: str
    source: call_start
    default: n01
    description: The resident's id in the HackFire registry. Never spoken.
  resident_name:
    type: str
    source: call_start
    default: Resident 01
    description: The resident's name as it should be said aloud, spoken in the greeting.
  address:
    type: str
    source: call_start
    default: PLACEHOLDER street 1, La Atalaya, El Tiemblo
    description: The resident's home address, as the registry holds it.
  zone:
    type: str
    source: call_start
    default: la-atalaya
    description: The at-risk zone id the backend knows. An identifier, never spoken.
  fire_status:
    type: str
    source: call_start
    default: "The predicted fire area already covers La Atalaya. The order for La Atalaya is to leave now for San Martín de Valdeiglesias."
    description: The fire at the zone and the coordinator's approved order, as get_fire_status would answer. The backend sends it with every call.
  route:
    type: str
    source: call_start
    default: "Drive to San Martín de Valdeiglesias along Carretera Toledo a Valladolid, N-403. It is about 6 kilometres, around 9 minutes by car."
    description: The resident's route by car under the approved order. Empty when the backend has none; the agent then asks get_evacuation_route.

tools:
  - get_evacuation_route
  - report_status
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "Hola, buenas. ¿Hablo con {{resident_name}}?"
  interruption:
    enabled: true

# Browser audio only. On SLNG a package declares no carrier: outbound phone
# calls use a SIP trunk attached to the deployed agent (see ../README.md).
channels:
  web:
    kind: realtime_audio

# A guess for the demo, not a measurement: a campaign of eight to ten residents.
capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 3m
