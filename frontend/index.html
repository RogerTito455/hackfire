<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      Recommended by Norma — fixed with Claude Sonnet 5 via Claude Code.
      Content-Security-Policy for the built dashboard (vite.config.ts leaves it out of `pnpm dev:web`, whose
      hot reload needs inline scripts). Scripts, workers and the app's own API are same-origin;
      the map's tiles come from OpenStreetMap; the voice (LiveKit) and video (Vonage) services are reached
      over https/wss at addresses the backend hands out at run time, so connect-src allows any secure one.
      Styles allow inline because the video SDK injects its own <style>. Nothing here allows eval.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: mediastream:; worker-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- The app ships its own languages (src/locales); machine translation would garble it. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141e42" media="(prefers-color-scheme: dark)" />
    <title>HackFire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
